name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: check / test / build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run check-types

      - name: Unit tests
        run: pnpm run test:unit

      - name: Build
        run: pnpm run build

      - name: Package smoke test
        run: |
          pnpm exec vsce package --no-dependencies -o /tmp/tuack-vscode.vsix
          python3 - <<'PY'
          import sys
          import zipfile

          with zipfile.ZipFile("/tmp/tuack-vscode.vsix") as vsix:
              names = vsix.namelist()

          unexpected = [n for n in names if n.startswith("extension/src/") or ".cache/" in n]
          if unexpected:
              print("unexpected files in VSIX:", unexpected)
              sys.exit(1)
          print(f"{len(names)} files in VSIX, no source and no .cache")
          PY
